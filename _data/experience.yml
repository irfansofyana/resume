- company: PT Super Bank Indonesia Tbk (Superbank)
  summary: Superbank is an Indonesian digital bank backed by Emtek, Grab, Singtel, and KakaoBank.
  positions:
    - role: AVP - Applied AI Engineer
      duration: April 2026 — Present
      summary: |
        Leading AI and automation platform initiatives at Superbank, balancing deep hands-on engineering with leadership across adoption, enablement, governance, and operational execution.
        <p> Key achievements and responsibilities: </p>
        <ul>
          <li>Lead applied AI and automation platform initiatives that help teams adopt AI safely, reduce repetitive work, and improve operational efficiency across the organization.</li>
          <li>Helped grow adoption of Superbank's internal AI tooling by approximately 3x from 2025 to 2026-to-date through engineering sharing sessions, department roadshows, and practical enablement for safe and effective GenAI usage.</li>
          <li>Own AI platform governance foundations, including usage visibility, budget controls, and spend tracking to support responsible scaling of AI tools.</li>
          <li>Established the n8n automation platform foundation for internal workflow automation, enabling teams to prototype and operationalize repeatable processes without adding bespoke service complexity.</li>
          <li>Authored and initiated SuperSkills, a collection of agent skills tailored to Superbank use cases that package repeatable AI workflows into reusable internal capabilities.</li>
          <li>Continue shaping internal platform capabilities across SuperGPT, LLM gateway, SuperMCP, SuperSkills, RAG platform capabilities, and related tooling.</li>
        </ul>
    - role: Manager - Software Engineer (DevEx)
      duration: June 2024 — March 2026
      summary: |
        Driving engineering excellence and productivity initiatives at Superbank through innovative developer tooling and streamlined processes. Empowering backend engineering teams to deliver high-quality software efficiently while maintaining exceptional developer experience.
        <p> Key achievements and responsibilities: </p>
        <ul>
          <li>Spearheaded one of Superbank's top 2025 backend engineering initiatives: migrating backend projects to GitLab to standardize delivery workflows and improve engineering governance across teams.</li>
          <li>Standardized the end-to-end API lifecycle with Apidog, improving consistency across API design, documentation, mocking, testing, and cross-team collaboration.</li>
          <li>Owned backend CI/CD standards across teams, including production base Docker images and shared pipeline conventions for reliability, security, and maintainability.</li>
          <li>Reduced Go microservice CI feedback loops by optimizing workflows and introducing Athens Go Proxy across backend services.</li>
          <li>Acted as AI Platform Architect &amp; Engineer for Superbank's internal AI platform, contributing to SuperGPT, an LLM API gateway, agent skills, SuperMCP, RAG platform capabilities, and related AI platform tooling.</li>
          <li>Drove company-wide GenAI awareness through regular sharing sessions, helping engineers and non-engineering teams understand practical use cases, safe adoption patterns, and emerging AI engineering practices.</li>
        </ul>

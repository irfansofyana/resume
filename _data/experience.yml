        <ul>
          <li> Contributed to compliance and adhere of Xendit to Bank Indonesia's SNAP API standard by developing and design Xendit's SNAP Payment API (QRIS, Virtual Account, Direct Debit, etc) to help merchants to integrate with Xendit using SNAP API standard. </li>

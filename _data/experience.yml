        <ul>
          <li>Ensured Xendit's compliance with Bank Indonesia's SNAP API standards by architecting and developing SNAP Payment API solutions (QRIS, Virtual Account, Ewallet, Direct Debit), enabling seamless merchant integration with standardized interface. Related work: <a href="https://developers.xendit.co/api-reference/#bi-snap" target="_blank" rel="noopener noreferrer">https://developers.xendit.co/api-reference/#bi-snap</a></li>

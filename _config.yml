# Site settings
title: "Irfan's Resume"
description: "Irfan's Resume"

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

# Resume settings
resume_avatar:                  "true"
resume_name:                    "Irfan Sofyana Putra"
resume_title:                   "Software Engineer"

# used for the contact button in _layouts/resume.html
resume_contact_email:           "mail@irfansp.dev"

# the next two items are used for schema itemprops in _layouts/resume.html
resume_contact_telephone:       "-"
resume_contact_address:         "Indonesia"

resume_header_contact_info:     "Jakarta, Indonesia • mail@irfansp.dev"
display_header_contact_info:    "false"

resume_header_intro: "<p>Irfan Sofyana Putra is a Senior Software Engineer from Indonesia with expertise in banking, payments, and Developer Experience. With a B.Sc. in Informatics from Bandung Institute of Technology. Irfan is known for his strong problem-solving skills, quick learning ability, and customer-oriented person. He has a proven track record of driving initiatives independently and delivering effective technology solutions across various domains he has worked in.</p>"

# use "yes" to display the email contact button,
# "no" to display an "I'm not looking for work" message,
# or remove the resume_looking_for_work option entirely
# to leave blank
resume_looking_for_work:        "yes"

# Decide which sections to use
# comment out to hide
resume_section_experience:      true
resume_section_education:       true
resume_section_projects:        true
resume_section_skills:          true
resume_section_recognition:     true
resume_section_certifications:   true
resume_section_links:           true
resume_section_associations:    true
# resume_section_interests:       true

# Resume social links
# uncomment the options you wish to display, and add your own URL
resume_social_links:
  resume_github_url:            "https://github.com/irfansofyana"
#  resume_twitter_url:           "http://twitter.com/jglovier"
#  resume_dribbble_url:          "https://dribbble.com/jag"
  resume_facebook_url:          "https://www.facebook.com/irfan.sofyanaputra/"
  resume_linkedin_url:          "https://www.linkedin.com/in/irfansofyana/"
  resume_instagram_url:         "https://www.instagram.com/irfansofyana/"
  resume_website_url:           "https://irfansp.dev"
  # resume_medium_url:            "https://medium.com/@irfansofyana"
resume_print_social_links:      true

# Design settings
resume_theme:                   default


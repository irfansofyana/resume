# Site settings
title: "Irfan Sofyana Putra - AVP Applied AI Engineer"
description: "Live resume for Irfan Sofyana Putra, AVP - Applied AI Engineer at Superbank focused on applied AI platforms, backend engineering, developer experience, infrastructure, open source, and automation."
url: "https://resume.irfansp.dev"
baseurl: ""

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed
exclude:
  - AGENTS.md

# Resume settings
resume_avatar:                  "true"
resume_name:                    "Irfan Sofyana Putra"
resume_title:                   "AVP - Applied AI Engineer @ Superbank"

# used for the contact button in _layouts/resume.html
resume_contact_email:           "mail@irfansp.dev"

# the next two items are used for schema itemprops in _layouts/resume.html
resume_contact_telephone:       "-"
resume_contact_address:         "Indonesia"

resume_header_contact_info:     "South Jakarta, Indonesia • mail@irfansp.dev • linkedin.com/in/irfansofyana"
display_header_contact_info:    "true"

resume_header_intro: "<p>I build applied AI platforms, backend engineering, developer experience tooling, and infrastructure for Fintech and Banking Companies. Currently, I lead AI and automation platform initiatives at Superbank, helping teams adopt AI safely, automate repeatable workflows, and improve operational execution.</p><p>Before Superbank, I spent four years at Xendit, growing from intern to Senior Software Engineer while building Open Banking APIs, payment infrastructure, and internal automation systems. Outside my day-to-day work, I stay active in open source through developer tooling, AI/LLM infrastructure, and productivity-focused projects. I am open to conversations around applied AI, backend engineering, developer experience, infrastructure, and engineering productivity roles.</p>"

resume_strengths:
  - Applied AI
  - Backend Engineering
  - Developer Experience
  - Infrastructure
  - Open Source
  - Banking & Payments

# use "yes" to display the email contact button,
# "no" to display an "I'm not looking for work" message,
# or remove the resume_looking_for_work option entirely
# to leave blank
resume_looking_for_work:        "yes"

# Last updated timestamp control
resume_show_last_updated:        true
resume_last_updated_date:        "June 13, 2026"

# Decide which sections to use
# comment out to hide
resume_section_experience:      true
resume_section_education:       true
resume_section_projects:        true
resume_section_skills:          true
resume_section_recognition:     true
resume_section_certifications:   true
resume_section_links:           true
resume_section_associations:    false
resume_section_publications:    true
